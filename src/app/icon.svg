<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Outer Background Gradient -->
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#161b2c" />
            <stop offset="100%" stop-color="#080a10" />
        </radialGradient>

        <!-- Icon Base Gradient (Dark Navy) -->
        <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#232942" />
            <stop offset="100%" stop-color="#15192b" />
        </linearGradient>

        <!-- Subtle Developer Grid Pattern -->
        <pattern id="devGrid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.03" />
        </pattern>

        <!-- 'A' Gradients for 3D Ribbon Effect -->
        <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>

        <linearGradient id="gradRight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="100%" stop-color="#7c3aed" />
        </linearGradient>

        <linearGradient id="gradCross" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#4f46e5" />
        </linearGradient>
        
        <linearGradient id="gradTop" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#7dd3fc" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>

        <!-- Filters -->
        <filter id="baseShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
        </filter>

        <filter id="aGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.3" />
        </filter>
    </defs>

    <!-- Main Background -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Icon Base (Rounded Square) -->
    <g filter="url(#baseShadow)">
        <rect x="106" y="106" width="300" height="300" rx="64" fill="url(#baseGrad)" stroke="#2d354d" stroke-width="1.5" />
        <!-- Developer-inspired subtle grid overlay -->
        <rect x="106" y="106" width="300" height="300" rx="64" fill="url(#devGrid)" />
        <!-- Top edge highlight for glass/3D effect -->
        <path d="M 170 108 L 342 108 A 62 62 0 0 1 404 170" fill="none" stroke="#4b5578" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- The 3D 'A' Logo -->
    <g filter="url(#aGlow)" transform="translate(256, 256)">
        
        <!-- Left Leg -->
        <path d="M -10 -90 L -75 75 L -45 75 L -10 -10 Z" fill="url(#gradLeft)" />
        
        <!-- Right Leg -->
        <path d="M 10 -90 L 75 75 L 45 75 L 10 -10 Z" fill="url(#gradRight)" />
        
        <!-- Crossbar (Interwoven ribbon) -->
        <path d="M -55 45 L 0 10 L 55 45 L 45 65 L 0 30 L -45 65 Z" fill="url(#gradCross)" />
        
        <!-- Top Peak (The fold) -->
        <path d="M -10 -90 L 0 -110 L 10 -90 L 0 -70 Z" fill="url(#gradTop)" />
        
        <!-- Subtle Highlights for 3D realism -->
        <path d="M -10 -90 L -45 65 L -35 65 L -5 -10 Z" fill="#ffffff" opacity="0.1" />
        <path d="M 10 -90 L 45 65 L 35 65 L 5 -10 Z" fill="#000000" opacity="0.15" />
        
    </g>
</svg>